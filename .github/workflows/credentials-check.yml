name: Store Credentials Check

# Every Monday - and on demand - this checks that the Chrome Web Store and Microsoft Edge
# credentials of this repository still work, so a broken key is found a week after it
# breaks instead of on release day. A problem fails the run, and GitHub then sends an
# e-mail. Nothing is uploaded or changed in any store. The weekly login also keeps an
# idle Google refresh token alive.
#
# Overview of all extensions: Get-StoreStatus.ps1 in the store-kit folder.

on:
  schedule:
    - cron: '33 6 * * 1'
  workflow_dispatch:
  # Test run when the check itself changes (same-repository branches only).
  pull_request:
    paths:
      - '.github/workflows/credentials-check.yml'
      - '.github/scripts/check-credentials.mjs'

permissions:
  contents: read

concurrency:
  group: credentials-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check store credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Chrome Web Store and Edge Add-ons
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_KEY_EXPIRES: ${{ vars.EDGE_KEY_EXPIRES }}
        run: node .github/scripts/check-credentials.mjs

  # GitHub switches scheduled workflows off in public repositories after 60 days without
  # repository activity, which would silently end these checks. Enabling the workflow
  # again on every scheduled run is a best-effort countermeasure (not guaranteed by
  # GitHub's documentation); Get-StoreStatus.ps1 reports a check that did not run.
  keepalive:
    name: Keep the schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable credentials-check.yml --repo "$GITHUB_REPOSITORY" || echo "::warning::Could not refresh the schedule."
