<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kleinanzeigen Plus</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="mark" aria-hidden="true">K+</span>
            <h1>Kleinanzeigen Plus</h1>
        </div>
        <div class="header-actions">
            <span class="version" id="version">v1.1.1</span>
            <label class="master-switch" title="Kleinanzeigen Plus ein- oder ausschalten">
                <input type="checkbox" id="master-toggle" role="switch" aria-label="Kleinanzeigen Plus ein- oder ausschalten" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
    </header>

    <div id="off-note" class="off-note" role="status" hidden>
        <span id="off-note-text">Kleinanzeigen Plus ist aus.</span>
    </div>

    <nav class="tabs-nav" role="tablist" aria-label="Bereiche">
        <button class="tab-btn active" data-tab="tab-filter" role="tab" aria-selected="true">Filter</button>
        <button class="tab-btn" data-tab="tab-helpers" role="tab" aria-selected="false">Hilfen</button>
        <button class="tab-btn" data-tab="tab-templates" role="tab" aria-selected="false">Vorlagen</button>
        <button class="tab-btn" data-tab="tab-blocked" role="tab" aria-selected="false">Blockiert</button>
    </nav>

    <main>
        <!-- Filter -->
        <section id="tab-filter" class="tab-content active" role="tabpanel">
            <div class="settings-group">
                <label class="toggle-container">
                    <span class="toggle-label">Werbung und Banner ausblenden</span>
                    <input type="checkbox" id="opt-hide-sponsored" role="switch">
                    <span class="toggle-slider"></span>
                </label>
                <label class="toggle-container">
                    <span class="toggle-label">Top-Anzeigen ausblenden</span>
                    <input type="checkbox" id="opt-hide-top" role="switch">
                    <span class="toggle-slider"></span>
                </label>
                <label class="toggle-container">
                    <span class="toggle-label">Top-Anzeigen ans Ende verschieben</span>
                    <input type="checkbox" id="opt-shift-top" role="switch">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="form-group">
                <label for="blacklist-input">Titel-Filter</label>
                <textarea id="blacklist-input" rows="4" placeholder="z. B. defekt, Bastler, Tausch"></textarea>
                <p class="help">Anzeigen mit diesen Wörtern im Titel werden ausgeblendet. Ein Wort pro Zeile.</p>
            </div>
        </section>

        <!-- Browsing helpers -->
        <section id="tab-helpers" class="tab-content" role="tabpanel">
            <div class="settings-group">
                <label class="toggle-container">
                    <span class="toggle-label">Bildervorschau bei Hover</span>
                    <input type="checkbox" id="opt-image-previews" role="switch">
                    <span class="toggle-slider"></span>
                </label>
                <label class="toggle-container">
                    <span class="toggle-label">Google-Maps-Link für Orte</span>
                    <input type="checkbox" id="opt-enable-maps" role="switch">
                    <span class="toggle-slider"></span>
                </label>
                <label class="toggle-container">
                    <span class="toggle-label">Sparpilot-Preisvergleich</span>
                    <input type="checkbox" id="opt-price-compare" role="switch">
                    <span class="toggle-slider"></span>
                </label>
                <label class="toggle-container">
                    <span class="toggle-label">Eigene Notizen zu Anzeigen</span>
                    <input type="checkbox" id="opt-enable-notes" role="switch">
                    <span class="toggle-slider"></span>
                </label>
                <label class="toggle-container">
                    <span class="toggle-label">Unendliches Scrollen</span>
                    <input type="checkbox" id="opt-infinite-scroll" role="switch">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="stats-mini">
                <div class="mini-stat">
                    <span id="count-seen" class="value">0</span>
                    <span class="label">Gesehen</span>
                    <button id="clear-seen" class="link-btn">Leeren</button>
                </div>
                <div class="mini-stat">
                    <span id="count-hidden" class="value">0</span>
                    <span class="label">Ausgeblendet</span>
                    <button id="clear-hidden" class="link-btn">Leeren</button>
                </div>
            </div>
        </section>

        <!-- Templates and snippets -->
        <section id="tab-templates" class="tab-content" role="tabpanel">
            <h2 class="caption">Anzeigenvorlagen</h2>
            <div id="templates-list" class="list-container templates-container">
                <div class="empty-state">Keine Vorlagen gespeichert</div>
            </div>

            <h2 class="caption">Chat-Antworten</h2>
            <div id="snippets-list" class="list-container snippets-container">
                <!-- Dynamic chat snippets list -->
            </div>
            <button id="add-snippet-btn" class="btn-secondary wide">+ Antwort hinzufügen</button>
        </section>

        <!-- Blocked users -->
        <section id="tab-blocked" class="tab-content" role="tabpanel">
            <h2 class="caption">Blockierte Verkäufer</h2>
            <div id="blocked-list" class="list-container">
                <div class="empty-state">Keine Verkäufer blockiert</div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <button id="reset-settings" class="btn-danger-quiet">Einstellungen zurücksetzen</button>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
